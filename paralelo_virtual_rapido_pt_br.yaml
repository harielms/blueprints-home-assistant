blueprint:
  name: "Paralelo Virtual — Sincronização rápida"
  description: >
    Sincroniza duas ou mais entidades de luz/interruptor nos dois sentidos.
    Ao detectar uma mudança real de estado, envia ligar/desligar somente às
    outras entidades. Não usa delay artificial nem comando toggle.
  domain: automation
  input:
    entidades:
      name: Entidades do paralelo
      description: Selecione os interruptores/luzes que devem acompanhar uns aos outros.
      selector:
        entity:
          multiple: true
          domain:
            - switch
            - light

triggers:
  - trigger: state
    entity_id: !input entidades
    to: "on"
    id: ligado
  - trigger: state
    entity_id: !input entidades
    to: "off"
    id: desligado

conditions: []

actions:
  - variables:
      entidades_paralelo: !input entidades
      entidade_origem: "{{ trigger.entity_id }}"
      estado_desejado: "{{ trigger.to_state.state }}"
      entidades_destino: >
        {{ entidades_paralelo | reject('equalto', trigger.entity_id) | list }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ estado_desejado == 'on' and (entidades_destino | count > 0) }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ entidades_destino }}"
      - conditions:
          - condition: template
            value_template: "{{ estado_desejado == 'off' and (entidades_destino | count > 0) }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ entidades_destino }}"

mode: queued
max: 10
max_exceeded: silent
